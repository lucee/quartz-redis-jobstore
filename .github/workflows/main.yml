name: Java CI

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # the tests use this Redis instead of starting one in docker (see RedisTestServer)
      REDIS_SERVER: localhost
      REDIS_PORT: 6379
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    strategy:
      fail-fast: false
      matrix:
        # 11 is the baseline (maven.compiler.release); the others make sure it works on newer JVMs
        java: [11, 17, 21]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and test
        run: mvn -B -e verify -Dgpg.skip

  # Publishing to Maven Central cannot be undone. Deploys only from master (a push, or a manual run), only after the
  # tests passed, never for a -SNAPSHOT version and not if that version is already on Maven Central (so a push without
  # a version bump in pom.xml does not fail: bump the version to release again).
  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Check if this version should be deployed
        id: check
        run: |
          GROUP=$(mvn -B help:evaluate -Dexpression=project.groupId -q -DforceStdout)
          ARTIFACT=$(mvn -B help:evaluate -Dexpression=project.artifactId -q -DforceStdout)
          VERSION=$(mvn -B help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version: $GROUP:$ARTIFACT:$VERSION"
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "::notice::$VERSION is a snapshot version, not deployed"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          URL="https://repo1.maven.org/maven2/${GROUP//.//}/$ARTIFACT/$VERSION/$ARTIFACT-$VERSION.pom"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          if [[ "$CODE" == "200" ]]; then
            echo "::notice::$VERSION is already on Maven Central, not deployed. Bump the version in pom.xml to release again."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      # Maven 3.10.0 (default on the GitHub runners since 2026-10-04) puts maven-metadata-local.xml into the staging
      # folder of the Central bundle, which Maven Central rejects ("Bundle has content that does NOT have a .pom file").
      # Maven 3.9.16 does not, so use that one for the deploy until the central-publishing plugin handles this.
      - name: Use Maven 3.9.16 for the deploy
        if: steps.check.outputs.deploy == 'true'
        run: |
          MVN_VERSION=3.9.16
          BASE=https://repo1.maven.org/maven2/org/apache/maven/apache-maven/$MVN_VERSION
          curl -fsSL -o "$RUNNER_TEMP/maven.tar.gz" "$BASE/apache-maven-$MVN_VERSION-bin.tar.gz"
          echo "$(curl -fsSL "$BASE/apache-maven-$MVN_VERSION-bin.tar.gz.sha512")  $RUNNER_TEMP/maven.tar.gz" | sha512sum -c -
          tar xzf "$RUNNER_TEMP/maven.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-$MVN_VERSION/bin" >> "$GITHUB_PATH"

      - name: Import GPG key
        if: steps.check.outputs.deploy == 'true'
        run: |
          echo "$GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Deploy to Maven Central
        if: steps.check.outputs.deploy == 'true'
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B -e clean deploy -DskipTests --settings maven-settings.xml
